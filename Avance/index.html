<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicios</title>
  </head>
  <body>
    <h2>Registro de Profesor</h2>
    <form action="" id="form-profesor">
      <label for="dni">DNI:</label>
      <input
        type="text"
        id="dni"
        name="dni"
        placeholder="Ej: 11111111A"
        required
      />

      <label for="nombre">Nombre:</label>
      <input
        type="text"
        id="nombre"
        name="nombre"
        placeholder="Ej: Pepe"
        required
      />

      <label for="apellido">Apellido: </label>
      <input
        type="text"
        id="apellido"
        name="apellido"
        placeholder="Ej: López Pérez"
      />

      <label for="telefono">Teléfono: </label>
      <input
        type="text"
        id="telefono"
        name="telefono"
        placeholder="Ej: 666666666"
      />

      <button id="btn" type="button">Enviar</button>
    </form>

    <hr />

    <!-- Formulario 2: Añadir Asignatura a Profesor -->
    <h2>Añadir Asignatura a Profesor</h2>
    <form action="" id="form-asignatura">
      <label for="dniProfesor">DNI del Profesor:</label>
      <input
        type="text"
        id="dniProfesor"
        name="dniProfesor"
        placeholder="Ej: 11111111A"
        required
      />

      <label for="codigoAsignatura">Código de Asignatura:</label>
      <input
        type="text"
        id="codigoAsignatura"
        name="codigoAsignatura"
        placeholder="Ej: 1111"
        required
      />

      <label for="nombreAsignatura">Nombre de Asignatura:</label>
      <input
        type="text"
        id="nombreAsignatura"
        name="nombreAsignatura"
        placeholder="Ej: DWEC"
        required
      />

      <button id="btn-asignatura" type="button">Añadir Asignatura</button>
    </form>
    <hr />

    <!-- Formulario 3: Buscar Profesor por Asignatura -->
    <h2>Buscar Profesor por Código de Asignatura</h2>
    <form action="" id="form-buscar">
      <label for="codigoBuscar">Código de Asignatura:</label>
      <input
        type="text"
        id="codigoBuscar"
        name="codigoBuscar"
        placeholder="Ej: 1111"
        required
      />

      <button id="btn-buscar" type="button">Buscar Profesor</button>
    </form>

    <script src="codigo.js"></script>
  </body>
</html>
